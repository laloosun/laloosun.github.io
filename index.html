<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daily Dish: A single recipe every day!" />
    <link rel="stylesheet" href="styles.css" />
    <title>Daily Dish - Recipe of the Day</title>
  </head>
  <body>
    <header>
      <h1>Daily Dish</h1>
      <p>Your daily dose of delicious recipes!</p>
    </header>

    <main>
      <section id="recipe">
        <!-- Button to refresh the recipe -->
        <button id="refresh-recipe-btn">Refresh Recipe</button>

        <h2 id="recipe-title">Loading...</h2>
        <img
          id="recipe-image"
          src=""
          alt="Recipe Image"
          style="max-width: 100%; height: auto; display: none"
        />
        <h3>Ingredients</h3>
        <ul id="ingredients-list"></ul>
        <h3>Instructions</h3>
        <p id="recipe-instructions">
          Please wait while we fetch today's recipe.
        </p>
      </section>
    </main>

    <footer>
      <p>
        If you found this useful and want to support hosting costs, you can
        donate:
      </p>
      <p>
        <!-- Replace YOUR_PAYPAL_LINK_HERE with your real PayPal donate URL -->
 <form action="https://www.paypal.com/donate" method="post" target="_top">
<input type="hidden" name="hosted_button_id" value="ASS4DZJ25ZWLG" />
<input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_donate_SM.gif" border="0" name="submit" title="PayPal - The safer, easier way to pay online!" alt="Donate with PayPal button" />
<img alt="" border="0" src="https://www.paypal.com/en_ES/i/scr/pixel.gif" width="1" height="1" />
</form>
      </p>
<p>&copy; <span id="year"></span> Daily Dish. All Rights Reserved.</p>
    </footer>

    <script>
      // Fetch Recipe from TheMealDB
      async function fetchRecipe() {
        try {
          const response = await fetch(
            "https://www.themealdb.com/api/json/v1/1/random.php"
          );
          const data = await response.json();
          const recipe = data.meals[0];

          // Set recipe title and image
          document.getElementById("recipe-title").textContent = recipe.strMeal;
          const recipeImage = document.getElementById("recipe-image");
          recipeImage.src = recipe.strMealThumb;
          recipeImage.style.display = "block";

          // Set recipe instructions
          document.getElementById("recipe-instructions").textContent =
            recipe.strInstructions;

          // Generate and display ingredients list
          const ingredientsList = document.getElementById("ingredients-list");
          ingredientsList.innerHTML = ""; // Clear previous content

          for (let i = 1; i <= 20; i++) {
            const ingredient = recipe["strIngredient" + i];
            const measure = recipe["strMeasure" + i];
            if (ingredient && ingredient.trim() !== "") {
              const listItem = document.createElement("li");
              listItem.textContent =
                (measure ? measure : "") + " " + ingredient;
              ingredientsList.appendChild(listItem);
            }
          }
        } catch (error) {
          document.getElementById("recipe-instructions").textContent =
            "Sorry, we couldn't fetch today's recipe. Please try again later.";
          console.error("Error fetching recipe:", error);
        }
      }

      // Fetch initial recipe
      fetchRecipe();

      // Refresh recipe on button click
      document
        .getElementById("refresh-recipe-btn")
        .addEventListener("click", function () {
          fetchRecipe();
        });
    </script>
    <script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

  </body>
</html>
